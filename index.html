<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Hop - Official Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #00ffcc; /* A nice neon cyan */
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffcc;
        }
        p {
            font-size: 1.2rem;
            color: #aaaaaa;
        }
        a {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #00ffcc;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }
        a:hover {
            background-color: #00ccaa;
            box-shadow: 0 0 15px #00ffcc;
        }
    </style>
</head>
<body>

    <h1>Glow Hop</h1>
    <p>The official website for the fast-paced neon arcade jumper.</p>
    
    <a href="https://play.google.com/store/apps/details?id=com.TwoWinApps.GlowHop" target="_blank">
        Play on Google Play
    </a>

</body>
</html>
